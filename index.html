<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obelisk Planner — Across the Obelisk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>Obelisk Planner</h1>
  <span class="subtitle">Planificateur d'objets et de route — Across the Obelisk</span>
</header>

<div class="layout">
  <aside>
    <div class="filter-group">
      <h2>Acte</h2>
      <div id="act-filters"></div>
    </div>
    <div class="filter-group">
      <h2>Affixe</h2>
      <div id="affix-filters"></div>
    </div>
    <button class="reset" id="reset-btn">Réinitialiser les filtres</button>
  </aside>

  <main>
    <div class="selected-banner" id="selected-banner">
      <span>Sélectionné : <strong id="selected-name"></strong> — les objets grisés sont incompatibles</span>
      <button class="clear" id="clear-selection-btn">Désélectionner</button>
    </div>
    <div class="result-bar">
      <span id="result-count"></span>
    </div>
    <div class="grid" id="item-grid"></div>
  </main>
</div>

<script src="js/app.js"></script>
</body>
</html>
